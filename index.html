<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hamburgueria Supreme</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>🍔 Hamburgueria Supreme</h1>
  </header>

  <main>
    <section id="menu">
      <h2>Cardápio</h2>
      <div class="item" onclick="addToCart('Cheddar Bacon', 29.9)">Cheddar Bacon - R$ 29,90</div>
      <div class="item" onclick="addToCart('Classic Burger', 24.9)">Classic Burger - R$ 24,90</div>
      <div class="item" onclick="addToCart('Duplo Smash', 34.9)">Duplo Smash - R$ 34,90</div>
    </section>

    <section id="cart">
      <h2>Seu Pedido</h2>
      <ul id="cart-items"></ul>
      <p>Total: R$ <span id="total">0.00</span></p>
      <button onclick="finalizeOrder()">Finalizar Pedido via WhatsApp</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Hamburgueria Supreme</p>
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</body>
</html>
